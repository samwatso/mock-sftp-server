services:
  sftp:
    image: atmoz/sftp:latest
    ports:
      - "${SFTP_PORT:-2222}:22"
    volumes:
      - ./users.conf:/etc/sftp/users.conf:ro
      # Persistent host keys → the server presents the same key across restarts,
      # so the known_hosts entry uploaded to CPI stays valid. Generated by
      # scripts/setup.sh (gitignored). Without these, atmoz/sftp regenerates the
      # host key on every recreate and breaks the SFTP adapter's host check.
      - ./ssh/ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key:ro
      - ./ssh/ssh_host_rsa_key:/etc/ssh/ssh_host_rsa_key:ro
      - ./data/upload:/home/${SFTP_USER:-labuser}/upload
      - ./data/inbox:/home/${SFTP_USER:-labuser}/inbox
      - ./data/outbox:/home/${SFTP_USER:-labuser}/outbox
      - ./data/archive:/home/${SFTP_USER:-labuser}/archive
    restart: unless-stopped
